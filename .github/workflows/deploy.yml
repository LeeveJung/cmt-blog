name: Deploy to production

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies and build
        run: |
          npm ci
          npm run build

      # The server's host keys are pinned via the SSH_KNOWN_HOSTS secret (verified
      # known_hosts lines, e.g. from `ssh-keygen -F <host>`). No ssh-keyscan: trusting whatever key the server presents
      # on each run would not detect a man-in-the-middle.
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::Secret SSH_KNOWN_HOSTS is not set." >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          # Keys are pinned under the HostKeyAlias "deploy-target", so the format of
          # SSH_HOST (hostname or IP) does not matter. Only "<type> <key>" of each
          # line is used; CR characters from copy & paste are stripped.
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' \
            | awk 'NF >= 2 && $1 !~ /^#/ { print "deploy-target", $(NF-1), $NF }' \
            > ~/.ssh/known_hosts_deploy
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts_deploy
          echo "Pinned host keys:"
          if ! ssh-keygen -lf ~/.ssh/known_hosts_deploy; then
            echo "::error::SSH_KNOWN_HOSTS contains no valid host keys." >&2
            exit 1
          fi
          cat > ~/.ssh/config <<CONFIG
          Host deploy-target
            HostName ${SSH_HOST}
            User ${SSH_USER}
            HostKeyAlias deploy-target
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts_deploy
          CONFIG
          chmod 600 ~/.ssh/config

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e ssh \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.claude/' \
            --exclude='var/' \
            --exclude='public/fileadmin/' \
            --exclude='public/typo3temp/' \
            --exclude='private/form_uploads/' \
            ./ \
            deploy-target:${{ secrets.DEPLOY_PATH }}

      - name: Post-deploy
        run: |
          ssh deploy-target \
            "cd ${{ secrets.DEPLOY_PATH }} && mkdir -p private/form_uploads && chmod 2770 private/form_uploads && (php vendor/bin/typo3 cache:flush || true)"
