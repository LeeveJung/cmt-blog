name: Deploy to production

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: production-ssh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies and build
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        uses: ./.github/actions/ssh-setup
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e ssh \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.claude/' \
            --exclude='var/' \
            --exclude='public/fileadmin/' \
            --exclude='public/typo3temp/' \
            --exclude='private/form_uploads/' \
            ./ \
            deploy-target:${{ secrets.DEPLOY_PATH }}

      - name: Post-deploy
        run: |
          ssh deploy-target \
            "cd ${{ secrets.DEPLOY_PATH }} && mkdir -p private/form_uploads && chmod 2770 private/form_uploads && (php vendor/bin/typo3 cache:flush || true)"
