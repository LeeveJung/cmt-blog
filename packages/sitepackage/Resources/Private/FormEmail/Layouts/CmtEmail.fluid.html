<!doctype html>
<html
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:v="urn:schemas-microsoft-com:vml"
    xmlns:o="urn:schemas-microsoft-com:office:office"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<head>
    <!--[if gte mso 15]>
    <xml>
        <o:OfficeDocumentSettings>
            <o:AllowPNG/>
            <o:PixelsPerInch>96</o:PixelsPerInch>
        </o:OfficeDocumentSettings>
    </xml>
    <![endif]-->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Nur helles Schema: die Markenfarben sind auf Weiß abgestimmt. -->
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title><f:render section="Title" optional="true" /></title>
    <style type="text/css"><![CDATA[
        :root { color-scheme: light; supported-color-schemes: light; }
        body { margin: 0; padding: 0; width: 100% !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table { border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
        p { margin: 0 0 14px; }
        a { color: #980600; }
        a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
        .content p:last-child { margin-bottom: 0; }

        @media only screen and (max-width: 620px) {
            .container { width: 100% !important; }
            .px { padding-left: 20px !important; padding-right: 20px !important; }
            .outer { padding: 0 !important; }
            .title { font-size: 22px !important; }
        }
    ]]></style>
</head>
<body style="margin:0; padding:0; background-color:#f6f1ef;">
<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color:#f6f1ef;">
    <tr>
        <td align="center" valign="top" class="outer" style="padding:32px 16px;">
            <!--[if (gte mso 9)|(IE)]><table role="presentation" align="center" border="0" cellspacing="0" cellpadding="0" width="600"><tr><td><![endif]-->
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" class="container" style="width:600px; max-width:600px; background-color:#ffffff; border-top:4px solid #980600;">
                <!-- HEADER -->
                <tr>
                    <td class="px" style="padding:28px 40px 24px; border-bottom:1px solid #ece4e2;">
                        <a href="{normalizedParams.siteUrl}" target="_blank" rel="noopener" style="text-decoration:none;">
                            <img
                                src="{f:uri.resource(path: 'EXT:sitepackage/Resources/Public/Images/cmt-logo_2026.png', absolute: 1)}"
                                width="160" height="48" alt="Leben mit CMT"
                                style="display:block; width:160px; height:auto; font-family:Georgia, 'Times New Roman', serif; font-size:22px; font-weight:bold; color:#980600;"
                            />
                        </a>
                    </td>
                </tr>
                <!-- TITLE -->
                <tr>
                    <td class="px title" style="padding:32px 40px 0; font-family:Georgia, 'Times New Roman', serif; font-size:26px; line-height:1.3; font-weight:bold; color:#1c1917;">
                        <f:render section="Title" optional="true" />
                    </td>
                </tr>
                <!-- BODY -->
                <tr>
                    <td class="px content" style="padding:20px 40px 40px; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:16px; line-height:1.6; color:#292524;">
                        <f:render section="Main" />
                    </td>
                </tr>
            </table>
            <!-- FOOTER -->
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" class="container" style="width:600px; max-width:600px;">
                <tr>
                    <td class="px" align="center" style="padding:24px 40px 0; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:13px; line-height:1.6; color:#78716c;">
                        <f:translate key="LLL:EXT:sitepackage/Resources/Private/Language/locallang.xlf:formEmail.footer" />
                        <br />
                        <a href="{normalizedParams.siteUrl}" target="_blank" rel="noopener" style="color:#980600; text-decoration:none; font-weight:bold;">{normalizedParams.httpHost}</a>
                    </td>
                </tr>
            </table>
            <!--[if (gte mso 9)|(IE)]></td></tr></table><![endif]-->
        </td>
    </tr>
</table>
</body>
</html>
