# EXT:form configuration set (auto-discovered in TYPO3 v14 via Configuration/Form/<SetName>/config.yaml).
name: brauer/sitepackage-form
label: 'Sitepackage – Form configuration'
priority: 100

persistenceManager:
  allowedExtensionPaths:
    10: 'EXT:sitepackage/Resources/Private/Forms/'
  allowSaveToExtensionPaths: false
  allowDeleteFromExtensionPaths: false

# Eigenes Mail-Design für alle Formular-Mails: Frage und Antwort untereinander, Logo und Farben der Seite
# statt TYPO3-SystemEmail-Layout. Das Template heißt weiterhin "Default" und überschreibt das des Cores.
prototypes:
  standard:
    finishersDefinition:
      EmailToReceiver:
        options:
          templateRootPaths:
            20: 'EXT:sitepackage/Resources/Private/FormEmail/Templates/'
          layoutRootPaths:
            20: 'EXT:sitepackage/Resources/Private/FormEmail/Layouts/'
      EmailToSender:
        options:
          templateRootPaths:
            20: 'EXT:sitepackage/Resources/Private/FormEmail/Templates/'
          layoutRootPaths:
            20: 'EXT:sitepackage/Resources/Private/FormEmail/Layouts/'
